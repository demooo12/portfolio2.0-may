<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>操作题视频方向-宋佳韵</title>
    
    <style>
        body { 
            background: #ffffff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            padding: 60px 20px; 
            margin: 0; 
            overflow-x: hidden; 
        }
        
        .controls { 
            display: flex; 
            gap: 20px; 
            margin-bottom: 40px; 
            align-items: center; 
            z-index: 10; 
        }
        
        button, .upload-btn { 
            background: transparent; 
            color: #333333; 
            border: 1px solid #333333; 
            padding: 8px 24px; 
            border-radius: 20px; 
            cursor: pointer; 
            font-size: 14px; 
            letter-spacing: 1px; 
            transition: all 0.3s ease;
        }
        
        button:hover, .upload-btn:hover { 
            background: #333333; 
            color: #ffffff; 
        }
        
        input[type="file"] { 
            display: none; 
        }
        
        #container { 
            position: relative; 
            display: flex; 
            justify-content: center; 
            z-index: 10; 
            width: 100%; 
            max-width: 820px; 
            height: 410px; 
        }
        
        video { 
            display: none; 
        }
        
        canvas { 
            display: block; 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
        }
    </style>
</head>
<body>

    <div class="controls">
        <button id="webcamBtn">开启摄像头</button>
        <button id="testVideoBtn">查看测试视频</button>
    </div>
    
    <div id="container">
        <video id="video" playsinline autoplay></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <script type="module">
        import { FaceLandmarker, FilesetResolver } from "./vendor/vision_bundle.mjs";

        const video = document.getElementById("video");
        const canvas = document.getElementById("output_canvas");
        const ctx = canvas.getContext("2d");

        let faceLandmarker;
        let isMirrored = false;
        let lastVideoTime = -1;
        let isPlaying = false;

        let smoothedL = null;
        let smoothedR = null;
        const RIGHT_SMOOTH_FACTOR = 0.35; 

        canvas.width = 820;
        canvas.height = 410;

        function drawIdleState() {
            let w = canvas.width / 2; 
            let h = canvas.height;

            ctx.fillStyle = "white"; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save(); 
            ctx.beginPath(); 
            ctx.rect(w, 0, w, h); 
            ctx.clip(); 
            drawRightGraphic(ctx, w + w/2, h/2, w, h, 0, 0, true); 
            ctx.restore();

            drawDualMask(ctx, w, h);
        }
        drawIdleState();

        async function initModel() {
            try {
                const vision = await FilesetResolver.forVisionTasks("./vendor/wasm");
                faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
                    baseOptions: { 
                        modelAssetPath: "./face_landmarker.task",
                        delegate: "GPU" 
                    },
                    runningMode: "VIDEO",
                    numFaces: 1
                });
                playTestVideo();
            } catch (error) {
                console.error(error); 
                alert("模型加载失败：" + error.message); 
            }
        }
        initModel();

        document.getElementById("webcamBtn").addEventListener("click", async () => {
            if (!faceLandmarker) return;
            isMirrored = true; 
            try { 
                const stream = await navigator.mediaDevices.getUserMedia({ video: true }); 
                video.srcObject = stream; 
                video.play(); 
            } catch (e) { 
                alert("无摄像头权限"); 
            }
        });

        function playTestVideo() {
            isMirrored = false;
            video.srcObject = null;
            video.src = "测试视频.mp4";
            video.loop = true;
            video.muted = true;
            video.play();
        }

        document.getElementById("testVideoBtn").addEventListener("click", playTestVideo);

        video.addEventListener("loadeddata", () => {
            if (!isPlaying) { 
                isPlaying = true; 
                window.requestAnimationFrame(predictWebcam); 
            }
        });

        async function predictWebcam() {
            let startTimeMs = performance.now();
            if (video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                const results = faceLandmarker.detectForVideo(video, startTimeMs);
                
                let w = canvas.width / 2; 
                let h = canvas.height;    
                
                let vw = video.videoWidth || 1;
                let vh = video.videoHeight || 1;

                ctx.fillStyle = "white"; 
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                let rawAngles = null;

                ctx.save(); 
                ctx.beginPath(); 
                ctx.rect(0, 0, w, h); 
                ctx.clip(); 
                
                ctx.save(); 
                if (isMirrored) { 
                    ctx.translate(w, 0); 
                    ctx.scale(-1, 1); 
                } 
                
                let scale = Math.max(w / vw, h / vh);
                let drawW = vw * scale;
                let drawH = vh * scale;
                let drawX = (w - drawW) / 2;
                let drawY = (h - drawH) / 2;
                
                ctx.drawImage(video, drawX, drawY, drawW, drawH); 
                ctx.restore();

                if (results.faceLandmarks && results.faceLandmarks.length > 0) {
                    rawAngles = drawEyeGeometry(results.faceLandmarks[0], w, h, vw, vh);
                }
                ctx.restore();

                if (rawAngles) {
                    if (smoothedL === null) { 
                        smoothedL = rawAngles.L; 
                        smoothedR = rawAngles.R; 
                    } else {
                        smoothedL += (rawAngles.L - smoothedL) * RIGHT_SMOOTH_FACTOR;
                        smoothedR += (rawAngles.R - smoothedR) * RIGHT_SMOOTH_FACTOR;
                    }
                    ctx.save(); 
                    ctx.beginPath(); 
                    ctx.rect(w, 0, w, h); 
                    ctx.clip(); 
                    drawRightGraphic(ctx, w + w/2, h/2, w, h, smoothedL, smoothedR); 
                    ctx.restore();
                } else {
                    ctx.save(); 
                    ctx.beginPath(); 
                    ctx.rect(w, 0, w, h); 
                    ctx.clip(); 
                    drawRightGraphic(ctx, w + w/2, h/2, w, h, 0, 0, true); 
                    ctx.restore();
                }

                drawDualMask(ctx, w, h);
            }
            if (isPlaying) window.requestAnimationFrame(predictWebcam);
        }

        function drawDualMask(ctx, w, h) {
            let cx1 = w / 2; 
            let cx2 = w + w / 2; 
            let cy = h / 2;
            
            let baseRadius = Math.min(w, h) / 2;
            let radiusX = baseRadius * 0.85; 
            let radiusY = baseRadius * 0.92; 
            
            const buildCapsule = (cx) => {
                let r = radiusX; 
                let dy = Math.max(0, radiusY - radiusX); 
                ctx.moveTo(cx - r, cy - dy);
                ctx.arc(cx, cy - dy, r, Math.PI, Math.PI * 2, false); 
                ctx.lineTo(cx + r, cy + dy);
                ctx.arc(cx, cy + dy, r, 0, Math.PI, false); 
                ctx.closePath();
            };

            ctx.save(); 
            ctx.beginPath(); 
            ctx.rect(0, 0, w * 2, h);
            buildCapsule(cx1); 
            buildCapsule(cx2); 
            ctx.fillStyle = "white"; 
            ctx.fill("evenodd"); 
            ctx.restore();

            let drawInnerShadow = (cx) => {
                ctx.save(); 
                
                ctx.beginPath(); 
                buildCapsule(cx); 
                ctx.clip(); 
                
                ctx.beginPath(); 
                ctx.rect(cx - w, cy - h, w * 2, h * 2); 
                buildCapsule(cx);
                
                ctx.fillStyle = "black"; 
                ctx.shadowColor = "rgba(0, 0, 0, 0.15)"; 
                // ⚠️ 此处将阴影弥散范围从 35 缩小到了 15，边缘会显得更精致锐利
                ctx.shadowBlur = 15; 
                ctx.fill("evenodd"); 
                
                ctx.beginPath(); 
                buildCapsule(cx);
                ctx.lineWidth = 1.5; 
                ctx.strokeStyle = "rgba(0,0,0,0.06)"; 
                ctx.shadowColor = "transparent"; 
                ctx.stroke();
                
                ctx.restore();
            };
            drawInnerShadow(cx1); 
            drawInnerShadow(cx2);
        }

        function getPt(landmarks, index, w, h, vw, vh) {
            let scale = Math.max(w / vw, h / vh);
            let drawW = vw * scale;
            let drawH = vh * scale;
            let drawX = (w - drawW) / 2;
            let drawY = (h - drawH) / 2;

            let x = landmarks[index].x * drawW + drawX; 
            let y = landmarks[index].y * drawH + drawY;
            if (isMirrored) { x = w - x; } 
            return { x: x, y: y };
        }

        function getCalibratedSignedAngle(ptOuter, ptTop, baseAngle) {
            let dx = ptOuter.x - ptTop.x; 
            let dy = ptOuter.y - ptTop.y;
            let dy_rot = dx * Math.sin(-baseAngle) + dy * Math.cos(-baseAngle);
            let dx_rot = dx * Math.cos(-baseAngle) - dy * Math.sin(-baseAngle);
            let rawAngle = Math.atan(dy_rot / Math.abs(dx_rot)) * 180 / Math.PI;
            return Math.max(0, rawAngle - 10);
        }

        function drawEyeGeometry(landmarks, w, h, vw, vh) {
            let sLeftOuter, sLeftInner, sLeftTop, sRightInner, sRightOuter, sRightTop;

            if (isMirrored) {
                sLeftOuter = getPt(landmarks, 263, w, h, vw, vh); sLeftInner = getPt(landmarks, 362, w, h, vw, vh); sLeftTop = getPt(landmarks, 386, w, h, vw, vh);
                sRightOuter = getPt(landmarks, 33, w, h, vw, vh); sRightInner = getPt(landmarks, 133, w, h, vw, vh); sRightTop = getPt(landmarks, 159, w, h, vw, vh);
            } else {
                sLeftOuter = getPt(landmarks, 33, w, h, vw, vh); sLeftInner = getPt(landmarks, 133, w, h, vw, vh); sLeftTop = getPt(landmarks, 159, w, h, vw, vh);
                sRightOuter = getPt(landmarks, 263, w, h, vw, vh); sRightInner = getPt(landmarks, 362, w, h, vw, vh); sRightTop = getPt(landmarks, 386, w, h, vw, vh);
            }

            let dxBase = sRightInner.x - sLeftInner.x; 
            let dyBase = sRightInner.y - sLeftInner.y;
            let angleBase = Math.atan2(dyBase, dxBase);
            
            let slopeBase = dyBase / dxBase; 
            let yStart = sLeftInner.y - slopeBase * sLeftInner.x; 
            let yEnd = sLeftInner.y + slopeBase * (w - sLeftInner.x);
            
            ctx.beginPath(); 
            ctx.moveTo(0, yStart); 
            ctx.lineTo(w, yEnd); 
            ctx.strokeStyle = "rgba(180,180,180,0.6)"; 
            ctx.lineWidth = 1; 
            ctx.stroke();

            let rawL = getCalibratedSignedAngle(sLeftOuter, sLeftTop, angleBase); 
            let rawR = getCalibratedSignedAngle(sRightOuter, sRightTop, angleBase);
            
            drawRayAndText(ctx, sLeftOuter, angleBase, rawL, "left", w, h); 
            drawRayAndText(ctx, sRightOuter, angleBase, rawR, "right", w, h);

            return { L: rawL, R: rawR };
        }

        function drawRayAndText(ctx, pt, angleBase, angleDeg, side, w, h) {
            let infiniteLength = w + h; 
            let idealTextDist = w * 0.22; 
            let rayAngleRad = angleBase + (side === "left" ? Math.PI + angleDeg * Math.PI / 180 : -angleDeg * Math.PI / 180);

            let extX = pt.x + Math.cos(rayAngleRad) * infiniteLength; 
            let extY = pt.y + Math.sin(rayAngleRad) * infiniteLength; 
            
            ctx.beginPath(); 
            ctx.moveTo(pt.x, pt.y); 
            ctx.lineTo(extX, extY); 
            ctx.strokeStyle = "rgba(90, 90, 90, 0.7)"; 
            ctx.lineWidth = 1.5; 
            ctx.stroke();
            
            ctx.beginPath(); 
            ctx.arc(pt.x, pt.y, 2.5, 0, 2*Math.PI); 
            ctx.fillStyle = "#888888"; 
            ctx.fill();

            let textX = pt.x + Math.cos(rayAngleRad) * idealTextDist; 
            let textY = pt.y + Math.sin(rayAngleRad) * idealTextDist;
            let cx = w / 2; 
            let cy = h / 2; 
            let baseRadius = Math.min(w, h) / 2;
            
            let safeRx = baseRadius * 0.85 - 70; 
            let safeRy = baseRadius * 0.92 - 30; 
            let dx = textX - cx; 
            let dy = textY - cy;
            let distSq = (dx * dx) / (safeRx * safeRx) + (dy * dy) / (safeRy * safeRy);
            
            if (distSq > 1) { 
                let scale = 1 / Math.sqrt(distSq); 
                textX = cx + dx * scale; 
                textY = cy + dy * scale; 
            }

            ctx.font = "300 23px Helvetica Neue, sans-serif"; 
            ctx.fillStyle = "#222222"; 
            ctx.textBaseline = "bottom";
            if (side === "left") { 
                ctx.textAlign = "right"; 
                ctx.fillText(angleDeg.toFixed(1) + "°", textX - 8, textY - 4); 
            } else { 
                ctx.textAlign = "left"; 
                ctx.fillText(angleDeg.toFixed(1) + "°", textX + 8, textY - 4); 
            }
        }

        function drawRightGraphic(ctx, cx, cy, w, h, angleL, angleR, isIdle = false) {
            let sumDeg = angleL + angleR;
            
            let factor = isIdle ? 1.0 : Math.max(0.01, Math.min(1.0, sumDeg / 25.0)); 

            let tiltDeg = isIdle ? 90 : 90 - sumDeg; 
            let tiltRad = tiltDeg * Math.PI / 180;
            let lineRad = -tiltRad; 
            let ellipseRad = tiltRad;   
            
            let L = (Math.min(w, h) / 2) * 0.75; 
            let a_gray = L * 0.7; 
            let b_gray = L * 1.0; 

            ctx.save(); 
            ctx.translate(cx, cy);
            
            ctx.save(); 
            ctx.rotate(ellipseRad); 
            ctx.beginPath(); 
            ctx.ellipse(0, 0, a_gray, b_gray, 0, 0, Math.PI*2); 
            ctx.fillStyle = "#e0e0e0"; 
            ctx.fill(); 
            ctx.restore(); 

            let phi = lineRad - ellipseRad; 
            let r_gray_x = (a_gray * b_gray) / Math.sqrt(Math.pow(b_gray * Math.cos(phi), 2) + Math.pow(a_gray * Math.sin(phi), 2));
            let phi_perp = phi + Math.PI / 2;
            let r_gray_y = (a_gray * b_gray) / Math.sqrt(Math.pow(b_gray * Math.cos(phi_perp), 2) + Math.pow(a_gray * Math.sin(phi_perp), 2));

            ctx.save(); 
            ctx.rotate(lineRad); 
            let a_white = r_gray_x * 0.92; 
            let b_white = r_gray_y * 0.8 * factor; 

            ctx.beginPath(); 
            ctx.ellipse(0, 0, a_white, b_white, 0, 0, Math.PI*2); 
            ctx.fillStyle = "white"; 
            ctx.fill();

            let lineLength = r_gray_x * 1.5; 
            ctx.beginPath(); 
            ctx.moveTo(-lineLength, 0); 
            ctx.lineTo(lineLength, 0); 
            ctx.strokeStyle = "#222222"; 
            ctx.lineWidth = 1.5; 
            ctx.stroke();
            
            ctx.beginPath(); 
            ctx.arc(r_gray_x, 0, 3.5, 0, Math.PI*2); 
            ctx.arc(-r_gray_x, 0, 3.5, 0, Math.PI*2); 
            ctx.fillStyle = "#222222"; 
            ctx.fill();

            ctx.restore(); 
            ctx.restore(); 
        }
    </script>
</body>
</html>
