<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kinetic Typography - 90% Condensed Text</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background-color: #f7f5f3;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        .text-container {
            perspective: 800px; 
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .line {
            width: 900px; 
            height: 35px; 
            display: block;
            overflow: visible; 
            transform-origin: center center;
            
            position: relative;
            z-index: calc(100 - var(--i));
            
            will-change: transform, color, stroke-width, filter;
            animation: foldWave360 6.4s infinite linear;
            animation-delay: calc(var(--i) * 0.3s);
        }

        .line text {
            font-size: 32px;
            font-weight: 400;
            fill: currentColor;
            stroke: currentColor;
            stroke-linejoin: round; 
            stroke-linecap: round;
            paint-order: stroke fill;
            
            /* 核心修改：将字体横向物理压缩至 90%，使其显得更瘦长 */
            transform: scaleX(0.97);
            transform-origin: left center; /* 确保压缩时依然保持完美的左对齐 */
        }

        @keyframes foldWave360 {
            0% {
                transform: translateY(0px) rotateX(0deg) scaleY(1);
                color: #000000;
                stroke-width: 0px;
                filter: blur(0px);
            }
            9.375% {
                transform: translateY(-20px) rotateX(-60deg) scaleY(2);
                color: #0013e9; 
                stroke-width: 80px;
                filter: blur(10px); 
            }
            15.625% {
                transform: translateY(-50px) rotateX(-120deg) scaleY(2);
                color: #66a200; 
                stroke-width: 100px;
                filter: blur(10px); 
            }
            27.344% {
                transform: translateY(-80px) rotateX(-180deg) scaleY(2.2);
                color: #ff0033; 
                stroke-width: 110px;
                filter: blur(16px); 
            }
            39.063% {
                transform: translateY(-50px) rotateX(-240deg) scaleY(2);
                color: #ffbb00; 
                stroke-width: 130px;
                filter: blur(10px);
            }
            46.875% {
                transform: translateY(-20px) rotateX(-300deg) scaleY(2);
                color: #ea00ff; 
                stroke-width: 80px;
                filter: blur(10px);
            }
            53.125%, 100% {
                transform: translateY(0px) rotateX(-360deg) scaleY(1);
                color: #000000;
                stroke-width: 0px;
                filter: blur(0px);
            }
        }
    </style>
</head>
<body>

    <div class="text-container" id="text-container"></div>

    <script>
        const textContent = [
            "“When I paint / I think and see / first and",
            "most — color / but color as motion // Color not",
            "only accompanying / form of lateral extension /",
            "and after being moved / remaining arrested //",
            "But of perpetual inner movement / as",
            "aggression — to and from the spectator /",
            "besides interaction and interdependence / with",
            "shape and hue and light // Color in a direct and",
            "frontal focus / and when closely felt / as",
            "breathing and pulsating / — from within”"
        ];

        const container = document.getElementById('text-container');

        textContent.forEach((text, index) => {
            const svgNS = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNS, 'svg');
            svg.setAttribute('class', 'line');
            svg.style.setProperty('--i', index);

            const textElement = document.createElementNS(svgNS, 'text');
            textElement.setAttribute('x', '0');
            textElement.setAttribute('y', '50%');
            textElement.setAttribute('dominant-baseline', 'middle');
            textElement.textContent = text;

            svg.appendChild(textElement);
            container.appendChild(svg);
        });
    </script>

</body>
</html>
