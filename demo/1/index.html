<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gooey Shapes & Perfect Morphing Polygon</title>
    <style>
        /* ==========================================
           【已锁定】字体加载
           ========================================== */
        @font-face {
            font-family: 'GoBold';
            src: url('./Go-Bold.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        /* 布局：横向排布，左右拉开间距 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background-color: #000000;
            display: flex;
            flex-direction: row; 
            justify-content: center;
            align-items: center;
            gap: 120px; 
            font-family: 'GoBold', sans-serif; 
            overflow: hidden;
        }

        /* ==========================================
           【左侧列】：打包黄色徽章和粉色波浪
           ========================================== */
        .left-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
        }

        .container {
            position: relative;
            width: 400px;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: -20px; 
        }

        .gooey-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: visible; 
            filter: url(#gooey-filter);
        }

        .star-wrapper {
            transform-origin: 200px 200px;
            transform: translateY(-10px) scaleX(0.88);
        }

        .rotating-star {
            transform-origin: 200px 200px; 
            animation: spin 10s infinite linear; 
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .text-overlay {
            position: absolute;
            width: 100%;
            text-align: center;
            color: #000000;
            z-index: 10;
        }

        .text-top {
            top: 84px; 
            font-size: 55px; 
            letter-spacing: -4px; 
            -webkit-text-stroke: 0px transparent; 
            transform: scaleY(0.75); 
        }

        .text-bottom {
            bottom: 63px; 
            font-size: 55px; 
            letter-spacing: -1px; 
            -webkit-text-stroke: 0px transparent; 
            transform: scaleY(0.7); 
        }

        .wave-container {
            position: relative;
            width: 400px;
            height: 200px;
            overflow: visible;
            transform: translateY(-30px);
        }

        .wave-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .travel-x {
            animation: moveX 7.5s linear infinite;
        }

        .peak-y {
            transform-origin: 0px 130px; 
            animation: growShrink 7.5s infinite;
        }

        .delay-1 { animation-delay: 0s; }
        .delay-2 { animation-delay: -1.25s; }
        .delay-3 { animation-delay: -2.5s; }
        .delay-4 { animation-delay: -3.75s; }
        .delay-5 { animation-delay: -5s; }
        .delay-6 { animation-delay: -6.25s; }

        @keyframes moveX {
            0% { transform: translateX(50px); }
            100% { transform: translateX(350px); }
        }

        @keyframes growShrink {
            0%, 20% { transform: scale(0); animation-timing-function: ease-out; }
            50% { transform: scale(1); animation-timing-function: ease-in; }
            80%, 100% { transform: scale(0); }
        }

        .color-wave {
            transform-origin: left center;
            animation: waveSlide 1.2s linear infinite; 
        }

        @keyframes waveSlide {
            0% { transform: translateX(-100px); } 
            100% { transform: translateX(0px); }  
        }

        /* ==========================================
           右侧列：忠实复刻的变形线条图形
           ========================================== */
        .right-column {
            position: relative;
            width: 464px;
            height: 464px;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .morphing-polygon {
            width: 100%;
            height: 100%;
            overflow: visible;
        }
        .morphing-polygon path {
            fill: none;
            stroke: #ffffff;
            stroke-width: 1;
            stroke-linejoin: miter;
            stroke-miterlimit: 3;
            stroke-linecap: butt;
            vector-effect: non-scaling-stroke;
        }
    </style>
</head>

  const idx=Math.floor(local/SEG), w=local-idx*SEG;
  const a=F[idx], b=F[(idx+1)%F.length];
  let t=w<HOLD?0:ease((w-HOLD)/MORPH);
  const pts=new Array(N);
  for(let i=0;i<N;i++) pts[i]=[a[i][0]+(b[i][0]-a[i][0])*t, a[i][1]+(b[i][1]-a[i][1])*t];
  rp.setAttribute("d",toPath(pts));
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
