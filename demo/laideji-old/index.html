<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>来得及！旧版原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 视觉系统：取自小红书网页版实际 token（2026-10-17 读取） */
:root{
  --bg:#F5F5F5; --surface:#FFFFFF;
  --ink:rgba(0,0,0,.8); --para:rgba(0,0,0,.62); --ink-2:rgba(0,0,0,.45); --ph:rgba(0,0,0,.27);
  --line:rgba(0,0,0,.08); --line-o:#EAEAEA; --fill1:rgba(48,48,52,.05); --fill2:rgba(48,48,52,.1);
  --primary:#FF2442; --primary-press:#E5203B; --primary2:#FFEDF0;
  --ok:#02B940; --ok2:#EAF8EF; --tight:#FF7D03; --tight2:#FFF2E6; --late:#FF2442; --late2:#FFEDF0;
  --apm:#3D8AF5; --apm2:#ECF4FE; --walk:#9A9A9E;
  --shadow-low:0 2px 8px 0 rgba(0,0,0,.04),0 1px 2px 0 rgba(0,0,0,.02);
  --font:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  /* 兼容旧变量名 */
  --sign:var(--primary);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F0F10; --surface:#1C1C1E; --ink:rgba(255,255,255,.84); --para:rgba(255,255,255,.56); --ink-2:rgba(255,255,255,.4);
    --ph:rgba(255,255,255,.21); --line:rgba(255,255,255,.07); --line-o:#2C2C2E; --fill1:rgba(255,255,255,.04); --fill2:rgba(255,255,255,.08);
    --primary2:rgba(255,36,66,.14); --ok2:rgba(2,185,64,.14); --tight2:rgba(255,125,3,.14); --late2:rgba(255,36,66,.14); --apm2:rgba(61,138,245,.14);
    --walk:#6E6E73; --shadow-low:none;
  }
  :root:not([data-theme="light"]) .lockup .sep{background:rgba(255,255,255,.2)}
}
:root[data-theme="dark"]{
  --bg:#0F0F10; --surface:#1C1C1E; --ink:rgba(255,255,255,.84); --para:rgba(255,255,255,.56); --ink-2:rgba(255,255,255,.4);
  --ph:rgba(255,255,255,.21); --line:rgba(255,255,255,.07); --line-o:#2C2C2E; --fill1:rgba(255,255,255,.04); --fill2:rgba(255,255,255,.08);
  --primary2:rgba(255,36,66,.14); --ok2:rgba(2,185,64,.14); --tight2:rgba(255,125,3,.14); --late2:rgba(255,36,66,.14); --apm2:rgba(61,138,245,.14);
  --walk:#6E6E73; --shadow-low:none;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
.wrap{max-width:480px;margin:0 auto;padding:12px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;height:56px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:4px;min-width:0}
.lockup{display:flex;align-items:center;gap:10px}
.lockup .xhs{display:block;height:24px;width:auto}
.lockup .sep{display:block;width:1px;height:18px;background:var(--line);background:rgba(0,0,0,.15)}
.logo{display:block;height:32px;width:auto}
.home .lockup{justify-content:center;gap:14px}
.home .lockup .xhs{height:34px}
.home .lockup .sep{height:26px}
.home .lockup .logo{height:48px}
.hero{text-align:center;margin:28px 0 36px}
.hero p{font-size:13px;line-height:20px;color:var(--ink-2);margin:12px 0 0}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .logo{filter:invert(1) hue-rotate(180deg)} }
:root[data-theme="dark"] .logo{filter:invert(1) hue-rotate(180deg)}
.back{display:flex;align-items:center;justify-content:center;width:36px;height:36px;margin-left:-8px;border-radius:9999px;background:none;color:var(--ink)}
.back:active{background:var(--fill1)}
.back svg{width:22px;height:22px}
.home h1{font-size:20px;line-height:28px;margin:0 0 16px}
.entry{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border-radius:16px;padding:16px 18px;margin-bottom:12px}
.entry svg{flex:none;width:28px;height:28px}
.entry b{display:block;font-size:20px;line-height:28px;font-weight:600}
.entry span{display:block;font-size:13px;line-height:20px}
.entry.main{background:var(--primary);color:#fff;min-height:88px}
.entry.main span{color:rgba(255,255,255,.85)}
.entry.main:active{background:var(--primary-press)}
.entry.sub{background:var(--surface);color:var(--ink);border:1px solid var(--line);min-height:76px}
.entry.sub span{color:var(--ink-2)}
.entry.sub:active{background:var(--fill1)}
.home .foot{font-size:12px;line-height:18px;color:var(--ink-2);margin-top:20px}
.notice{background:var(--apm2);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:14px;line-height:20px;margin-bottom:12px}
.airport{font:inherit;font-size:13px;line-height:20px;font-weight:500;color:var(--ink);background:var(--fill1);border:none;border-radius:9999px;padding:6px 12px;width:auto;appearance:none;-webkit-appearance:none}
h1{font-size:24px;line-height:32px;font-weight:600;margin:8px 0 16px;color:var(--ink)}
textarea,input,select{font:inherit;font-size:16px;line-height:24px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
textarea::placeholder,input::placeholder{color:var(--ph)}
textarea{min-height:120px;resize:vertical}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--ink)}
button{font:inherit;cursor:pointer;border:none}
button:focus-visible,.upload:focus-within,.chip:focus-within{outline:2px solid var(--apm);outline-offset:2px}
.primary{display:block;width:100%;height:48px;border-radius:9999px;background:var(--primary);color:#fff;font-size:16px;font-weight:600}
.primary:active{background:var(--primary-press)}
.primary:disabled{background:rgba(48,48,52,.15);color:rgba(0,0,0,.27);cursor:default}
.ghost{display:block;margin:8px auto 0;background:none;color:var(--ink-2);font-size:14px;padding:10px 12px}
.row{display:flex;gap:8px;align-items:center;margin:12px 0 16px}
.upload{display:flex;align-items:center;gap:10px;flex:1;background:var(--fill1);border-radius:12px;padding:12px 14px;cursor:pointer;color:var(--para);font-size:14px}
.upload input{position:absolute;opacity:0;width:1px;height:1px}
.thumb{width:40px;height:40px;object-fit:cover;border-radius:8px;display:none}
.hint{font-size:12px;line-height:18px;color:var(--ink-2);margin:6px 0 0}
.err{font-size:13px;line-height:20px;color:var(--late);margin:8px 0 0;min-height:1em;text-align:center}
label.f{display:block;font-size:13px;line-height:20px;font-weight:500;color:var(--para);margin:20px 0 8px}
.two{display:grid;grid-template-columns:2fr 3fr;gap:8px}
.two select{font-size:14px;padding-left:10px;padding-right:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;display:flex;align-items:center;height:36px;padding:0 14px;border-radius:9999px;background:var(--fill1);color:var(--para);font-size:14px;cursor:pointer}
.chip input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.chip:has(input:checked){background:var(--primary2);color:var(--primary);font-weight:500}
.missing{background:var(--tight2);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:14px;line-height:20px;margin-bottom:4px}
[hidden]{display:none!important}

/* 结果 */
.verdict{border-radius:12px;padding:20px 20px 18px;margin-bottom:12px}
.verdict.ok{background:var(--ok2)} .verdict.tight{background:var(--tight2)} .verdict.late{background:var(--late2)} .verdict.plan{background:var(--apm2)}
.verdict.plan .big{color:var(--ink);font-variant-numeric:tabular-nums}
.verdict .sub{font-size:16px;line-height:24px;font-weight:500;color:var(--ink);margin-top:2px}
.verdict .sub2{font-size:12px;line-height:18px;color:var(--ink-2);margin-top:2px}
.gatenote{font-size:13px;line-height:20px;color:var(--para);margin-top:10px}
.verdict .big{font-size:32px;line-height:40px;font-weight:600}
.verdict.ok .big{color:var(--ok)} .verdict.tight .big{color:var(--tight)} .verdict.late .big{color:var(--late)}
.verdict .nums{display:flex;gap:32px;margin-top:12px}
.verdict .nums b{display:block;font-size:24px;line-height:32px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.verdict .nums span{font-size:12px;line-height:18px;color:var(--ink-2)}
.map{background:var(--surface);border-radius:12px;padding:12px 8px 8px;margin-bottom:12px;box-shadow:var(--shadow-low)}
.map svg{display:block;width:100%;height:auto}
.map .cap{font-size:10px;line-height:14px;color:var(--ink-2);text-align:right;margin:2px 8px 0}
.routecard{background:var(--surface);border-radius:12px;padding:16px 16px 4px;margin-bottom:12px;box-shadow:var(--shadow-low)}
.route{list-style:none;margin:0;padding:0}
.route li{position:relative;padding:0 0 16px 28px}
.route li::before{content:"";position:absolute;left:4px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--ink)}
.route li::after{content:"";position:absolute;left:8px;top:19px;bottom:-1px;width:3px;border-radius:2px;background:var(--seg,var(--walk))}
.route li:last-child::after{display:none}
.route li:first-child::before{background:var(--primary);border-color:var(--primary)}
.route li:last-child::before{background:var(--ink);border-color:var(--ink)}
.route .t{font-size:16px;line-height:22px;font-weight:500;color:var(--ink)}
.route .m{font-size:13px;line-height:20px;color:var(--ink-2)}
.route .tip{display:inline-block;font-size:12px;line-height:18px;color:var(--para);background:var(--fill1);padding:4px 8px;border-radius:4px;margin-top:6px}
.legend{display:flex;gap:16px;font-size:12px;line-height:18px;color:var(--ink-2);padding:8px 0 12px;border-top:1px solid var(--line);margin-top:4px}
.legend i{display:inline-block;width:12px;height:3px;vertical-align:middle;margin-right:6px;border-radius:2px}
.card{background:var(--surface);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow-low)}
.card h2{font-size:16px;line-height:24px;font-weight:600;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.src{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:4px;background:var(--primary2);color:var(--primary);font-size:10px;line-height:14px;font-weight:500}
.explain{white-space:pre-wrap;font-size:15px;line-height:22px;color:var(--para)}
.notes{margin:12px 0 0;padding:12px 0 0;border-top:1px solid var(--line)}
.notes summary{font-size:13px;line-height:20px;color:var(--ink-2);cursor:pointer;list-style:none}
.notes summary::-webkit-details-marker{display:none}
.notes ul{margin:8px 0 0;padding:0;list-style:none}
.notes li{font-size:13px;line-height:20px;color:var(--para);padding:4px 0}
.notes li::before{content:"";display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--primary);margin:0 8px 3px 0}
.note{font-size:12px;line-height:18px;color:var(--ink-2);margin:4px 4px 16px}
@media (prefers-reduced-motion:no-preference){
  .verdict{animation:pop .3s ease-out}
  @keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
}
/* ===== 桌面端：iPhone 外框 ===== */
.phone{display:contents}
.statusbar,.island,.homebar{display:none}
html.framed{height:100%;background:radial-gradient(1200px 700px at 70% 10%, rgba(255,36,66,.10), transparent 60%), linear-gradient(160deg,#F7F5F8 0%,#ECE9EF 100%)}
html.framed body{height:100%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:transparent}
html.framed .phone{display:block;position:relative;width:393px;height:852px;flex:none;transform-origin:center center;border-radius:56px;background:var(--bg);
    box-shadow:0 0 0 11px #121214, 0 0 0 13px #2C2C30, 0 0 0 14px #5A5A60, 0 40px 80px -20px rgba(20,10,30,.35), 0 18px 36px -18px rgba(20,10,30,.30);overflow:hidden}
html.framed .phone .wrap{position:absolute;inset:0;max-width:none;overflow-y:auto;overscroll-behavior:contain;padding-top:56px;scrollbar-width:none}
html.framed .phone .wrap::-webkit-scrollbar{display:none}
html.framed .statusbar{display:flex;position:absolute;top:0;left:0;right:0;height:50px;padding:0 30px 0 38px;align-items:center;justify-content:space-between;z-index:5;
    font-size:15px;font-weight:600;color:var(--ink);background:linear-gradient(var(--bg) 70%,transparent);pointer-events:none}
html.framed .statusbar .icons{display:flex;gap:6px;align-items:center}
html.framed .statusbar svg{display:block;height:12px;width:auto;fill:currentColor}
html.framed .island{display:block;position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;border-radius:20px;background:#000;z-index:6}
html.framed .homebar{display:block;position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--ink);opacity:.85;z-index:6;pointer-events:none}


</style>
</head>

  <!-- STEP 1: input -->
  <section id="s-input" hidden>
    <div id="modeNote"></div>
    <h1 id="inputTitle">你在哪，要去哪，<br>还有多久？</h1>
    <textarea id="q" placeholder="例：我在浦东 T2 刚过安检，推着行李，要去 H179，还有 40 分钟起飞"></textarea>
    <div class="row">
      <label class="upload">
        <img id="thumb" class="thumb" alt="">
        <span id="uploadTxt">上传登机牌或航班截图</span>
        <input id="file" type="file" accept="image/*">
      </label>
    </div>
    <button class="primary" id="parseBtn">帮我判断</button>
    <p class="err" id="parseErr"></p>
    <button class="ghost" id="manualBtn">不用 AI，手动填写</button>
  </section>

  <!-- STEP 2: confirm -->
  <section id="s-confirm" hidden>
    <h1>确认一下信息</h1>
    <div id="missingBox"></div>
    <div id="rushFields">
      <label class="f" for="from">你现在在哪</label>
      <div class="two">
        <input id="fromGate" placeholder="在登机口？填编号">
        <select id="from" aria-label="当前位置"></select>
      </div>
    </div>
    <div id="planFields" hidden>
      <label class="f" for="term">从哪个航站楼出发</label>
      <select id="term"></select>
      <label class="f" for="pdate">起飞时间</label>
      <div class="two">
        <select id="pdate" aria-label="起飞日期"><option value="0">今天</option><option value="1">明天</option><option value="2">后天</option></select>
        <input id="ptime" type="time" aria-label="起飞时刻">
      </div>
    </div>
    <label class="f" for="gate" id="gateLabel">登机口</label>
    <div class="two">
      <input id="gate" placeholder="如 H179">
      <select id="zone" aria-label="登机口所在区域"></select>
    </div>
    <p class="hint" id="gateHint"></p>
    <div id="minsBlock">
      <label class="f" for="mins">离起飞还有几分钟</label>
      <input id="mins" type="number" inputmode="numeric" min="0" placeholder="如 40">
    </div>
    <label class="f">同行情况</label>
    <div class="chips">
      <label class="chip"><input type="checkbox" id="bag">带大件行李</label>
      <label class="chip"><input type="checkbox" id="slow">带小孩或老人</label>
      <label class="chip"><input type="checkbox" id="peak">安检高峰时段</label>
      <label class="chip"><input type="checkbox" id="checkin">还没值机或要托运</label>
    </div>
    <div style="height:24px"></div>
    <button class="primary" id="calcBtn">算一下</button>
    <p class="err" id="calcErr"></p>
    <button class="ghost" id="back1">重新输入</button>
  </section>

  <!-- STEP 3: result -->
  <section id="s-result" hidden>
    <div class="verdict" id="verdict">
      <div class="big" id="vBig"></div>
      <div class="sub" id="vSub" hidden></div>
      <div class="sub2" id="vSub2" hidden></div>
      <div class="nums">
        <div><b id="vEta"></b><span id="vEtaL">预计要走</span></div>
        <div><b id="vMargin"></b><span id="vMarginL">登机口关闭前的余量</span></div>
      </div>
      <div class="gatenote" id="gateNote" hidden></div>
    </div>
    <div class="card" id="explainCard">
      <h2>怎么走最稳<span class="src">AI 整理自小红书经验贴</span></h2>
      <div class="explain" id="explain"></div>
      <details class="notes" id="notes"><summary id="notesSum"></summary><ul id="notesList"></ul></details>
    </div>
    <div class="map" id="map" role="img" aria-label="路线示意图"></div>
    <div class="routecard">
      <ol class="route" id="route"></ol>
      <div class="legend">
        <span><i style="background:var(--walk)"></i>步行</span>
        <span><i style="background:var(--tight)"></i>安检</span>
        <span><i style="background:var(--apm)"></i>捷运</span>
      </div>
    </div>
    <p class="note" id="basis"></p>
    <button class="primary" id="again">再查一次</button>
    <button class="ghost" id="toRush" hidden>到机场后，用「我在机场」重新算</button>
  </section>

/* ================== 计算：耗时模型 + 最短路 ================== */
function edgeMinutes(e, ctx){
  if(e.type==="walk"){
    let speed = AIRPORT.walkSpeed;
    if(ctx.bag) speed *= 0.85;
    if(ctx.slow) speed *= 0.75;
    return e.m / speed / 60;
  }
  if(e.type==="walkmin"){
    let f = 1; if(ctx.bag) f *= 0.85; if(ctx.slow) f *= 0.75;
    return e.min / f;
  }
  if(e.type==="security") return ctx.peak ? 25 : 12;
  if(e.type==="border") return ctx.peak ? 30 : 12;
  if(e.type==="apm") return e.wait + e.ride;
  return 0;
}
function buildAdj(){
  const adj = {};
  for(const e of AIRPORT.edges){
    (adj[e.a] ||= []).push({to:e.b, e});
    if(e.oneway===false || (e.oneway!==true && e.type!=="security" && e.type!=="border")){
      // 步行默认双向；已单独写了反向的边会重复，不影响最短路结果
      (adj[e.b] ||= []).push({to:e.a, e});
    }
  }
  return adj;
}
function shortest(from, to, ctx){
  const adj = buildAdj(), dist = {}, prev = {}, done = new Set();
  for(const n in AIRPORT.nodes) dist[n] = Infinity;
  dist[from] = 0;
  while(true){
    let u = null;
    for(const n in dist) if(!done.has(n) && (u===null || dist[n] < dist[u])) u = n;
    if(u===null || dist[u]===Infinity) break;
    if(u===to) break;
    done.add(u);
    for(const {to:v, e} of adj[u]||[]){
      const d = dist[u] + edgeMinutes(e, ctx);
      if(d < dist[v]){ dist[v] = d; prev[v] = {from:u, e}; }
    }
  }
  if(dist[to]===Infinity) return null;
  const steps = []; let cur = to;
  while(cur!==from){ const p = prev[cur]; steps.unshift({from:p.from, to:cur, e:p.e, min:edgeMinutes(p.e, ctx)}); cur = p.from; }
  return {total: dist[to], steps};
}

// 中文时长兜底换算：不依赖 AI
function cnNum(t){
  if(t==null) return NaN;
  if(/^\d+(\.\d+)?$/.test(t)) return parseFloat(t);
  const d = {零:0,一:1,二:2,两:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9};
  if(t==="十") return 10;
  const m = /^([一二两三四五六七八九])?十([一二三四五六七八九])?$/.exec(t);
  if(m) return (m[1]?d[m[1]]:1)*10 + (m[2]?d[m[2]]:0);
  return t.length===1 && t in d ? d[t] : NaN;
}
function parseDurationCN(text){
  const s = String(text||"").replace(/\s/g,"");
  const N = "(\\d+(?:\\.\\d+)?|[零一二两三四五六七八九十]+)";
  let m;
  if((m = new RegExp(N+"个?半(?:个)?小时").exec(s))) return Math.round(cnNum(m[1])*60+30);
  if(/(?:^|[^个\d一二两三四五六七八九十])半(?:个)?小时/.test(s) || /^半(?:个)?小时/.test(s)) return 30;
  if((m = new RegExp(N+"个?(?:小时|钟头)(?:"+N+"分钟?)?").exec(s))){
    const h = cnNum(m[1]), mi = m[2] ? cnNum(m[2]) : 0;
    if(!isNaN(h)) return Math.round(h*60 + (isNaN(mi)?0:mi));
  }
  if((m = new RegExp(N+"刻钟?").exec(s))) { const k = cnNum(m[1]); if(!isNaN(k)) return k*15; }
  if((m = new RegExp(N+"分钟").exec(s))) { const k = cnNum(m[1]); if(!isNaN(k)) return Math.round(k); }
  return null;
}
function minutesUntil(hhmm){
  const m = /^(\d{1,2}):(\d{2})$/.exec(hhmm||""); if(!m) return null;
  const now = new Date(), t = new Date(now);
  t.setHours(+m[1], +m[2], 0, 0);
  let diff = Math.round((t - now)/60000);
  if(diff < -120) diff += 24*60;     // 跨午夜
  return diff;
}

function applyParse(r){
  if(r.airport && AIRPORTS[r.airport] && r.airport!==AIRPORT.code) setAirport(r.airport);
  ["fromGate","gate","mins"].forEach(id => $(id).value = "");
  const fz = AIRPORT.zoneForGate(r.from_gate);
  if(fz){ $("from").value = fz; $("fromGate").value = r.from_gate; }
  else if(r.from && AIRPORT.nodes[r.from]) $("from").value = r.from;
  if(r.gate){ $("gate").value = r.gate; const z = AIRPORT.gateZones[String(r.gate).toUpperCase()] || AIRPORT.zoneForGate(r.gate); if(z) $("zone").value = z; }
  let mins = Number.isFinite(Number(r.minutes_left)) && r.minutes_left!==null && r.minutes_left!=="" ? Number(r.minutes_left) : minutesUntil(r.departure_time);
  if(mins==null || !Number.isFinite(mins)) mins = parseDurationCN($("q").value);
  if(mins!=null) $("mins").value = mins;
  $("bag").checked = !!r.bag; $("slow").checked = !!r.slow;
  const h = new Date().getHours(); $("peak").checked = (h>=6&&h<9)||(h>=16&&h<20);
  const miss = Array.isArray(r.missing) ? r.missing.filter(m => !(m==="当前位置" && $("from").value)) : [];
  if(!$("zone").value && !miss.includes("登机口区域")) miss.push("登机口区域");
  $("missingBox").innerHTML = miss.length ? `<div class="missing">还需要你补充：${miss.join("、")}</div>` : "";
}

function applyPlanParse(r){
  if(r.airport && AIRPORTS[r.airport] && r.airport!==AIRPORT.code) setAirport(r.airport);
  $("gate").value = ""; $("zone").value = "";
  if(r.terminal && AIRPORT.terminals.some(t => t.id===r.terminal)) $("term").value = r.terminal;
  if(Number.isInteger(r.day_offset) && r.day_offset>=0 && r.day_offset<=2) $("pdate").value = String(r.day_offset);
  if(/^\d{1,2}:\d{2}$/.test(r.departure_time||"")) $("ptime").value = r.departure_time.padStart(5,"0");
  if(r.gate){ $("gate").value = r.gate; const z = AIRPORT.zoneForGate(r.gate); if(z) $("zone").value = z; }
  $("checkin").checked = !!r.checkin; $("slow").checked = !!r.slow; $("bag").checked = false;
  autoPeak();
  const miss = Array.isArray(r.missing) ? r.missing.filter(Boolean) : [];
  $("missingBox").innerHTML = miss.length ? `<div class="missing">还需要你补充：${miss.join("、")}</div>` : "";
}
const fmt = x => { const d = ((x % 1440) + 1440) % 1440; return `${x<0?"前一天 ":""}${Math.floor(d/60)}:${String(d%60).padStart(2,"0")}`; };

function calcPlan(){
  const t = AIRPORT.terminals.find(t => t.id === $("term").value);
  const m = /^(\d{1,2}):(\d{2})$/.exec($("ptime").value||"");
  if(!t || !m){ $("calcErr").textContent = "航站楼和起飞时间都要填。"; return; }
  const D = +m[1]*60 + +m[2];
  const ctx = {bag:$("bag").checked, slow:$("slow").checked, peak:$("peak").checked};
  let zone = $("zone").value, guessed = false;
  if(zone && !t.zones.includes(zone)){
    $("calcErr").textContent = `这个登机口不在 ${t.label} 出发的范围内，请检查航站楼或登机口。`; return;
  }
  let res;
  if(zone){ res = shortest(t.hall, zone, ctx); }
  else {
    guessed = true;
    for(const z of t.zones){ const r = shortest(t.hall, z, ctx); if(r && (!res || r.total > res.total)){ res = r; zone = z; } }
  }
  if(!res){ $("calcErr").textContent = "这两个位置之间暂时没有路线数据。"; return; }
  $("calcErr").textContent = "";
  const E = Math.ceil(res.total), B = 15, C = 10;
  const intl = AIRPORT.isIntl($("gate").value, zone);
  const checkinClose = intl ? 60 : 45, needCheckin = $("checkin").checked;
  const latest = needCheckin ? Math.min(D - checkinClose - C, D - AIRPORT.closeBeforeDep - C - E) - B : D - AIRPORT.closeBeforeDep - E - B;
  renderPlan({t, zone, guessed, res, E, latest, D, needCheckin, checkinClose, ctx});
}

    同行: {小孩或老人:o.ctx.slow, 安检高峰:o.ctx.peak},
    路线: o.res.steps.map(s => ({到: AIRPORT.nodes[s.to], 方式: typeLabel(s.e), 分钟: Math.round(s.min), 提醒: s.e.tip||null}))
  };

/* ================== 示意地图（不按比例） ================== */
function drawMap(from, to, steps, gateLabel){
  const POS = AIRPORT.pos;
  const onRoute = new Map(steps.map(st => [[st.from,st.to].sort().join("|"), st.e.type]));
  const seen = new Set(); let base = "", hot = "";
  for(const e of AIRPORT.edges){
    const k = [e.a,e.b].sort().join("|"); if(seen.has(k)) continue; seen.add(k);
    const [x1,y1] = POS[e.a], [x2,y2] = POS[e.b];
    base += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--line-o)" stroke-width="3" stroke-linecap="round"${e.type==="apm"?' stroke-dasharray="2 6"':''}/>`;
    if(onRoute.has(k)) hot += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${typeColor(onRoute.get(k))}" stroke-width="6" stroke-linecap="round"/>`;
  }
  const routeNodes = new Set([from, ...steps.map(st=>st.to)]);
  let nodes = "";
  const textAt = (x,y,ta,name,fill,fw) => {
    const lines = String(name).split("\n"), lh = 13, y0 = y - (lines.length-1)*lh/2;
    return `<text x="${x}" y="${y0}" text-anchor="${ta}" font-size="11" fill="${fill}" font-weight="${fw}" paint-order="stroke" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round">`
      + lines.map((l,i)=>`<tspan x="${x}" dy="${i?lh:0}">${l}</tspan>`).join("") + `</text>`;
  };
  for(const [id,[x,y,anc,name,always]] of Object.entries(POS)){
    if(id===from || id===to) continue;
    const on = routeNodes.has(id);
    const lx = anc==="r"?x+10:anc==="l"?x-10:x, ly = anc==="b"?y+18:anc==="t"?y-10:y+4, ta = anc==="r"?"start":anc==="l"?"end":"middle";
    nodes += `<circle cx="${x}" cy="${y}" r="${on?5:3}" fill="var(--surface)" stroke="${on?'var(--ink)':'var(--walk)'}" stroke-width="2"/>`
      + ((on || always) ? textAt(lx, ly, ta, name, on?'var(--ink)':'var(--ink-2)', on?600:400) : "");
  }
  const [dx,dy] = POS[to], [fx,fy] = POS[from];
  const dest = `<rect x="${dx-8}" y="${dy-8}" width="16" height="16" rx="4" fill="var(--ink)"/><path d="M${dx-4} ${dy} l3 3 l5 -6" fill="none" stroke="var(--surface)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`
    + `<text x="${dx}" y="${dy+24}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)" paint-order="stroke" stroke="var(--surface)" stroke-width="3">${gateLabel || POS[to][3]}</text>`;
  const pin = `<g transform="translate(${fx},${fy})"><path d="M0 0 C-6 -8 -10 -13 -10 -19 A10 10 0 1 1 10 -19 C10 -13 6 -8 0 0Z" fill="var(--primary)" stroke="var(--surface)" stroke-width="1.5"/><circle cx="0" cy="-19" r="3.5" fill="var(--surface)"/>`
    + (fy < 70
      ? `<text x="14" y="-16" text-anchor="start" font-size="12" font-weight="600" fill="var(--primary)" paint-order="stroke" stroke="var(--bg)" stroke-width="3">${pinText}</text></g>`
      : `<text x="0" y="-35" text-anchor="middle" font-size="12" font-weight="600" fill="var(--primary)" paint-order="stroke" stroke="var(--surface)" stroke-width="3">${pinText}</text></g>`);
  const zones = AIRPORT.decor;
  $("map").innerHTML = `<svg viewBox="0 0 360 ${AIRPORT.mapH}" xmlns="http://www.w3.org/2000/svg" font-family="inherit">${zones}${base}${hot}${nodes}${dest}${pin}</svg><p class="cap">示意图，不按比例</p>`;
}

function typeColor(t){ return t==="apm"?"var(--apm)":(t==="security"||t==="border")?"var(--tight)":"var(--walk)"; }
function typeLabel(e){ return e.type==="apm"?"坐捷运":e.type==="security"?"过安检":e.type==="border"?"安检和边检":"步行"; }

function renderRoute(from, to, res){
  const items = [`<li style="--seg:${res.steps[0]?typeColor(res.steps[0].e.type):'var(--walk)'}"><div class="t">${AIRPORT.nodes[from]}</div><div class="m">${pinText}</div></li>`];
  res.steps.forEach((s,i) => {
    const next = res.steps[i+1];
    items.push(`<li style="--seg:${next?typeColor(next.e.type):'var(--walk)'}">
      <div class="t">${AIRPORT.nodes[s.to]}</div>
      <div class="m">${typeLabel(s.e)} 约 ${Math.max(1,Math.round(s.min))} 分钟${s.e.m?`，${s.e.m} 米`:""}</div>
      ${s.e.tip?`<div class="tip">${s.e.tip}</div>`:""}</li>`);
  });
  $("route").innerHTML = items.join("");
  drawMap(from, to, res.steps, ($("gate").value||"").toUpperCase());
  $("notesSum").textContent = `结合近期小红书经验贴总结，参考 ${AIRPORT.sources.length} 篇笔记`;
  $("notesList").innerHTML = AIRPORT.sources.map(t => `<li>${t}</li>`).join("");
}

async function renderResult(from, to, mins, ctx, res){
  const eta = Math.ceil(res.total);
  const intl = AIRPORT.isIntl($("gate").value, to);
  const needCheckin = $("checkin").checked;
  // 值机/托运截止：国内约起飞前 45 分钟，国际约 60 分钟（笔记评论区多次提到，以航司为准）
  const checkinClose = intl ? 60 : 45;
  // 托运：既要在截止前办完（值机办理约 10 分钟），也要在登机口关闭前走到，取更严格的那个
  const C = 10;
  const margin = needCheckin
    ? Math.min(mins - checkinClose - C, mins - AIRPORT.closeBeforeDep - C - eta)
    : mins - AIRPORT.closeBeforeDep - eta;
  const level = margin >= 15 ? "ok" : margin >= 0 ? "tight" : "late";
  $("verdict").className = "verdict " + level;
  $("vSub").hidden = true; $("vSub2").hidden = true; $("gateNote").hidden = true;
  $("vEtaL").textContent = "预计要走"; $("vMarginL").textContent = needCheckin ? "截止前的余量" : "登机口关闭前的余量";
  $("again").textContent = "再查一次"; $("toRush").hidden = true;
  pinText = "你在这里";
  $("vBig").textContent = level==="ok" ? "来得及！" : level==="tight" ? "很紧，别停" : "来不及";
  $("vEta").textContent = eta + " 分钟";
  $("vMargin").textContent = (margin>=0? margin : "差 " + (-margin)) + " 分钟";

  renderRoute(from, to, res);
  $("basis").textContent = (needCheckin ? `按值机柜台起飞前约 ${checkinClose} 分钟关闭估算，具体以航司为准。` : `按登机口起飞前约 ${AIRPORT.closeBeforeDep} 分钟关闭估算。`) + AIRPORT.basis;

  show("s-result");

  const sample = await samplePromise;
  if(!sample){ $("explainCard").hidden = true; return; }
  $("explainCard").hidden = false; $("explain").textContent = "正在整理建议…";
  const data = {
    结论: $("vBig").textContent, 预计耗时分钟: eta, 余量分钟: margin, 离起飞分钟: mins,
    截止节点: needCheckin ? `值机柜台关闭（起飞前约 ${checkinClose} 分钟）` : `登机口关闭（起飞前约 ${AIRPORT.closeBeforeDep} 分钟）`, 登机口: $("gate").value || "未知",
    同行: {大件行李:ctx.bag, 小孩或老人:ctx.slow, 安检高峰:ctx.peak},
    路线: res.steps.map(s => ({到: AIRPORT.nodes[s.to], 方式: typeLabel(s.e), 分钟: Math.round(s.min), 提醒: s.e.tip||null}))
  };
  try{
    await sample(EXPLAIN_PROMPT(data), { modelTier:"quick", onText: ({text}) => { $("explain").textContent = text; } });
  }catch(e){
    $("explain").textContent = e.text || "建议暂时生成不了，按上面的路线走即可。";
  }
}

function fit(){const on=fine.matches||window.innerWidth>=600;r.classList.toggle("framed",on);const p=document.querySelector(".phone");if(!p)return;
if(on){const k=Math.min(1,(window.innerHeight-56)/852,(window.innerWidth-48)/393);p.style.transform="scale("+k+")";}else p.style.transform="";}
fit();window.addEventListener("resize",fit);fine.addEventListener&&fine.addEventListener("change",fit);})();
(function(){const t=document.getElementById("sbTime");if(!t)return;const f=()=>{const d=new Date();t.textContent=d.getHours()+":"+String(d.getMinutes()).padStart(2,"0");};f();setInterval(f,30000);})();
</script>
